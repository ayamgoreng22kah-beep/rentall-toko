<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barang - RENTALL</title>
  <meta name="description" content="Lihat barang sewaan di RENTALL.">
  <style>
    body { font-family: sans-serif; margin: 0; background: #f4f5f7; color: #1f2937; }
    .bahasa { position: fixed; top: 10px; right: 10px; z-index: 5; background: rgba(255,255,255,0.9); border-radius: 10px; padding: 3px; font-size: 12px; }
    .bahasa button { border: 0; background: none; padding: 5px 9px; border-radius: 8px; cursor: pointer; color: #046a4f; font-weight: 700; }
    .bahasa button.aktif { background: #046a4f; color: #fff; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
    .kembali { display: inline-block; color: #046a4f; font-weight: 700; font-size: 14px; text-decoration: none; margin: 40px 0 12px; }
    .gambar { height: 260px; background: #046a4f; border-radius: 16px; overflow: hidden; }
    .gambar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tag { display: inline-block; font-size: 11px; color: #046a4f; background: #e0f5ef; border-radius: 8px; padding: 3px 8px; margin-top: 14px; }
    .tag[hidden] { display: none !important; }
    h1 { font-size: 22px; margin: 8px 0 4px; }
    .harga { color: #046a4f; font-size: 20px; font-weight: 800; }
    .satuan { color: #6b7684; font-size: 13px; font-weight: 400; }
    .toko { color: #6b7684; font-size: 13px; margin-top: 6px; }
    .toko a { color: #046a4f; font-weight: 700; }
    .deskripsi { color: #374151; font-size: 14px; line-height: 1.6; white-space: pre-line; margin: 14px 0; }
    .tombol { display: block; text-align: center; background: #046a4f; color: #fff; text-decoration: none; font-weight: 700; padding: 13px; border-radius: 14px; margin: 16px 0; }
    .ajakan { text-align: center; background: #046a4f; color: #fff; border-radius: 16px; padding: 16px; margin: 20px 0; }
    .ajakan p { margin: 0 0 10px; font-weight: 700; font-size: 15px; }
    .ajakan a { display: inline-block; background: #fff; color: #046a4f; text-decoration: none; font-weight: 700; font-size: 13px; padding: 9px 16px; border-radius: 12px; }
    .pesan { text-align: center; padding: 60px 20px; color: #6b7684; font-size: 15px; }
    h2 { font-size: 16px; margin: 28px 0 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
    .kartu { background: #fff; border: 1px solid #e5e8e6; border-radius: 14px; overflow: hidden; color: inherit; text-decoration: none; display: block; }
    .kartu .g { height: 110px; background: #046a4f; }
    .kartu .g img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .kartu .i { padding: 10px; }
    .kartu .j { font-size: 13px; font-weight: 600; }
    .kartu .h { color: #046a4f; font-weight: 700; font-size: 13px; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="bahasa">
    <button id="btnId" onclick="setBahasa('id')">ID</button><button id="btnEn" onclick="setBahasa('en')">EN</button>
  </div>

  <div class="wrap">
    <a class="kembali" id="kembali" href="/">← Toko</a>
    <div class="pesan" id="pesan" hidden></div>

    <div id="konten" hidden>
      <div class="gambar"><img id="foto" alt=""></div>
      <span class="tag" id="tag" hidden></span>
      <h1 id="judul"></h1>
      <div class="harga"><span id="harga"></span> <span class="satuan" id="satuan"></span></div>
      <div class="toko" id="tokoInfo"></div>
      <p class="deskripsi" id="deskripsi"></p>
      <a class="tombol link-app" id="btnSewa" href="https://expo.dev/accounts/ayam24s-team/projects/rentall/builds/b08bf00a-de1c-49b1-bc82-944648cd31b6" target="_blank" rel="noopener"></a>

      <div class="ajakan">
        <p id="ajakanTeks"></p>
        <a class="link-app" href="https://expo.dev/accounts/ayam24s-team/projects/rentall/builds/b08bf00a-de1c-49b1-bc82-944648cd31b6" target="_blank" rel="noopener" id="ajakanBtn"></a>
      </div>
    </div>

    <h2 id="judulSerupa" hidden></h2>
    <div class="grid" id="serupa"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://xdzmysjfpwcpjdrwkksk.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhkem15c2pmcHdjcGpkcndra3NrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzODE4MjgsImV4cCI6MjEwMzk1NzgyOH0.FR2EeoAnrYFjD4p12s-6CoDGg6FG6svgyyOqRfbsRBk';
    const LINK_APLIKASI = 'https://expo.dev/accounts/ayam24s-team/projects/rentall/builds/b08bf00a-de1c-49b1-bc82-944648cd31b6';
    const headers = { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` };

    const TEKS = {
      id: {
        tag: 'Paket', sewa: 'Sewa di aplikasi', kembali: '← Toko', serupa: 'Barang serupa',
        ajakan: 'Mau sewa barang ini atau menawarkan barangmu? Unduh RENTALL.',
        unduh: 'Unduh RENTALL', tidakTersedia: 'Barang ini sudah tidak tersedia.',
        alamatSalah: 'Alamat barang ini tidak ditemukan.', gagal: 'Gagal memuat barang. Coba lagi nanti.',
        oleh: 'oleh', satuan: { jam: 'jam', hari: 'hari', bulan: 'bulan' }, locale: 'id-ID'
      },
      en: {
        tag: 'Package', sewa: 'Rent in the app', kembali: '← Shop', serupa: 'Similar items',
        ajakan: 'Want to rent this item or offer your own? Download RENTALL.',
        unduh: 'Download RENTALL', tidakTersedia: 'This item is no longer available.',
        alamatSalah: 'This item address was not found.', gagal: 'Failed to load the item. Please try again later.',
        oleh: 'by', satuan: { jam: 'hour', hari: 'day', bulan: 'month' }, locale: 'en-US'
      }
    };

    let bahasa = (navigator.language || 'id').toLowerCase().startsWith('id') ? 'id' : 'en';
    let barangAktif = null;
    let dataSerupa = [];

    const bagian = decodeURIComponent(location.pathname.replace(/^\/t\//, '').replace(/\/$/, '')).split('/');
    const tokoSlug = bagian[0] || '';
    const barangSegmen = bagian[1] || '';

    function slugify(s) {
      return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    }
    function slugBarang(b) {
      return `${slugify(b.judul)}-${b.id.slice(0, 4)}`;
    }
    function urlBarang(b) {
      return `/t/${encodeURIComponent(b.toko_slug)}/${slugBarang(b)}`;
    }
    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function rupiah(n) {
      return 'Rp' + Number(n).toLocaleString(TEKS[bahasa].locale);
    }
    function satuanLabel(s) {
      return TEKS[bahasa].satuan[s] || TEKS[bahasa].satuan.hari;
    }

    function terapkanBahasa() {
      const t = TEKS[bahasa];
      document.documentElement.lang = bahasa;
      document.getElementById('btnId').classList.toggle('aktif', bahasa === 'id');
      document.getElementById('btnEn').classList.toggle('aktif', bahasa === 'en');
      document.getElementById('kembali').textContent = t.kembali;
      document.getElementById('btnSewa').textContent = t.sewa;
      document.getElementById('ajakanTeks').textContent = t.ajakan;
      document.getElementById('ajakanBtn').textContent = t.unduh;
      document.getElementById('judulSerupa').textContent = t.serupa;
      document.querySelectorAll('.link-app').forEach(el => { el.href = LINK_APLIKASI; });
      if (barangAktif) tampilkanBarang();
      tampilkanSerupa();
    }

    function setBahasa(b) {
      bahasa = b;
      terapkanBahasa();
    }

    function tampilkanBarang() {
      const t = TEKS[bahasa];
      const b = barangAktif;
      document.title = `${b.judul} - RENTALL`;
      document.querySelector('meta[name="description"]').setAttribute('content',
        `${b.judul} - ${rupiah(b.harga_sewa)}/${satuanLabel(b.satuan_harga)}. ${b.deskripsi ? b.deskripsi.slice(0, 120) : 'Sewa di RENTALL.'}`);
      document.getElementById('foto').src = (b.foto && b.foto[0]) || '';
      document.getElementById('judul').textContent = b.judul;
      document.getElementById('harga').textContent = rupiah(b.harga_sewa);
      document.getElementById('satuan').textContent = `/${satuanLabel(b.satuan_harga)}`;
      document.getElementById('deskripsi').textContent = b.deskripsi || '';
      const tag = document.getElementById('tag');
      tag.textContent = t.tag;
      tag.hidden = b.jenis !== 'paket';
      const namaToko = b.toko_nama || b.toko_slug;
      document.getElementById('tokoInfo').innerHTML =
        `${t.oleh} <a href="/t/${encodeURIComponent(b.toko_slug)}">${escapeHtml(namaToko)}</a>`;
      document.getElementById('kembali').href = `/t/${encodeURIComponent(tokoSlug)}`;
      document.getElementById('konten').hidden = false;
    }

    function tampilkanSerupa() {
      const grid = document.getElementById('serupa');
      const judul = document.getElementById('judulSerupa');
      judul.hidden = dataSerupa.length === 0;
      grid.innerHTML = dataSerupa.map(b => {
        const foto = (b.foto && b.foto[0]) ? `<img src="${escapeHtml(b.foto[0])}" alt="${escapeHtml(b.judul)}">` : '';
        return `<a class="kartu" href="${escapeHtml(urlBarang(b))}">
          <div class="g">${foto}</div>
          <div class="i">
            <div class="j">${escapeHtml(b.judul)}</div>
            <div class="h">${rupiah(b.harga_sewa)} /${satuanLabel(b.satuan_harga)}</div>
          </div>
        </a>`;
      }).join('');
    }

    function pasangDataTerstruktur(b) {
      const data = {
        '@context': 'https://schema.org',
        '@type': 'Product',
        name: b.judul,
        description: b.deskripsi || b.judul,
        image: (b.foto && b.foto[0]) ? [b.foto[0]] : [],
        offers: {
          '@type': 'Offer',
          price: String(b.harga_sewa),
          priceCurrency: 'IDR',
          availability: 'https://schema.org/InStock',
          url: location.href
        }
      };
      const s = document.createElement('script');
      s.type = 'application/ld+json';
      s.textContent = JSON.stringify(data);
      document.head.appendChild(s);
    }

    async function muatBarang() {
      const url = `${SUPABASE_URL}/rest/v1/barang_publik?toko_slug=eq.${encodeURIComponent(tokoSlug)}&select=*`;
      const res = await fetch(url, { headers });
      const data = await res.json();
      if (!res.ok) throw new Error('gagal');
      const b = data.find(x => barangSegmen === slugBarang(x));
      if (!b) {
        document.getElementById('kembali').href = `/t/${encodeURIComponent(tokoSlug)}`;
        document.getElementById('pesan').textContent = TEKS[bahasa].tidakTersedia;
        document.getElementById('pesan').hidden = false;
        return;
      }
      barangAktif = b;
      tampilkanBarang();
      pasangDataTerstruktur(b);
      await muatSerupa(b);
    }

    async function muatSerupa(b) {
      const url = `${SUPABASE_URL}/rest/v1/barang_publik?kategori=eq.${encodeURIComponent(b.kategori)}&id=neq.${b.id}&select=*&order=created_at.desc&limit=6`;
      const res = await fetch(url, { headers });
      dataSerupa = res.ok ? await res.json() : [];
      tampilkanSerupa();
    }

    terapkanBahasa();
    muatBarang().catch(() => {
      document.getElementById('pesan').textContent = TEKS[bahasa].gagal;
      document.getElementById('pesan').hidden = false;
    });
  </script>
</body>
</html>
