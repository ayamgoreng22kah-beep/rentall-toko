<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko - RENTALL</title>
  <meta name="description" content="Lihat toko sewa di RENTALL.">
  <style>
    body { font-family: sans-serif; margin: 0; background: #f4f5f7; color: #1f2937; }
    .banner { height: 160px; background: #046a4f center/cover no-repeat; }
    .profil { text-align: center; margin-top: -48px; }
    .foto { width: 96px; height: 96px; border-radius: 50%; border: 4px solid #fff; background: #e0f5ef; object-fit: cover; }
    .nama { font-size: 20px; font-weight: 700; margin: 10px 0 4px; }
    .info { color: #6b7684; font-size: 14px; }
    .badge { display: inline-block; background: #e0f5ef; color: #046a4f; padding: 4px 10px; border-radius: 12px; font-size: 12px; margin-top: 6px; }
    .pesan { text-align: center; padding: 40px; color: #6b7684; }
    .daftar { max-width: 720px; margin: 24px auto; padding: 0 16px; }
    .daftar h2 { font-size: 16px; margin: 0 0 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
    .kartu { background: #fff; border: 1px solid #e5e8e6; border-radius: 14px; overflow: hidden; text-decoration: none; color: inherit; }
    .kartu .gambar { height: 130px; background: #046a4f; display: flex; align-items: center; justify-content: center; }
    .kartu .gambar img { width: 100%; height: 100%; object-fit: cover; }
    .kartu .isi { padding: 10px; }
    .kartu .judul { font-size: 14px; font-weight: 600; }
    .kartu .harga { color: #046a4f; font-weight: 700; font-size: 14px; margin-top: 4px; }
    .kartu .satuan { color: #6b7684; font-weight: 400; font-size: 11px; }
    .tag { font-size: 10px; color: #046a4f; background: #e0f5ef; border-radius: 8px; padding: 2px 6px; display: inline-block; margin-bottom: 4px; }
    .kosong { color: #6b7684; font-size: 14px; text-align: center; padding: 20px; }
  </style>
</head>
<body>
  <div class="banner" id="banner"></div>
  <div class="profil">
    <img class="foto" id="foto" alt="">
    <div class="nama" id="nama">Memuat...</div>
    <div class="info" id="rating"></div>
    <div id="badge"></div>
  </div>
  <div class="pesan" id="pesan"></div>

  <div class="daftar" id="daftar" hidden>
    <h2>Barang dan paket</h2>
    <div class="grid" id="grid"></div>
    <div class="kosong" id="kosong" hidden>Belum ada barang yang aktif.</div>
  </div>

  <script>
    const SUPABASE_URL = 'https://xdzmysjfpwcpjdrwkksk.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhkem15c2pmcHdjcGpkcndra3NrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzODE4MjgsImV4cCI6MjEwMzk1NzgyOH0.FR2EeoAnrYFjD4p12s-6CoDGg6FG6svgyyOqRfbsRBk';

    const slug = decodeURIComponent(location.pathname.replace(/^\/t\//, '').replace(/\/$/, ''));
    const headers = { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` };

    function rupiah(n) {
      return 'Rp' + Number(n).toLocaleString('id-ID');
    }

    function satuanLabel(s) {
      return s === 'jam' ? 'jam' : s === 'bulan' ? 'bulan' : 'hari';
    }

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function muatToko() {
      const url = `${SUPABASE_URL}/rest/v1/toko_publik?slug=eq.${encodeURIComponent(slug)}&select=*`;
      const res = await fetch(url, { headers });
      const data = await res.json();
      if (!res.ok || !data.length) {
        document.getElementById('nama').textContent = 'Toko tidak ditemukan';
        document.getElementById('pesan').textContent = 'Alamat toko ini tidak tersedia.';
        return;
      }
      const t = data[0];
      document.title = `${t.nama} - RENTALL`;
      document.getElementById('nama').textContent = t.nama;
      document.getElementById('rating').textContent = `★ ${Number(t.rating_avg || 0).toFixed(1)}`;
      if (t.foto_url) document.getElementById('foto').src = t.foto_url;
      if (t.banner_url) document.getElementById('banner').style.backgroundImage = `url(${t.banner_url})`;
      if (t.badge_terverifikasi) document.getElementById('badge').innerHTML = '<span class="badge">Terverifikasi</span>';
      await muatBarang();
    }

    async function muatBarang() {
      const url = `${SUPABASE_URL}/rest/v1/barang_publik?toko_slug=eq.${encodeURIComponent(slug)}&select=*&order=created_at.desc`;
      const res = await fetch(url, { headers });
      const data = await res.json();
      document.getElementById('daftar').hidden = false;
      const grid = document.getElementById('grid');
      if (!res.ok || !data.length) {
        document.getElementById('kosong').hidden = false;
        return;
      }
      grid.innerHTML = data.map(b => {
        const foto = (b.foto && b.foto[0])
          ? `<img src="${escapeHtml(b.foto[0])}" alt="${escapeHtml(b.judul)}">`
          : '';
        const tag = b.jenis === 'paket' ? '<span class="tag">Paket</span><br>' : '';
        return `<div class="kartu">
          <div class="gambar">${foto}</div>
          <div class="isi">
            ${tag}
            <div class="judul">${escapeHtml(b.judul)}</div>
            <div class="harga">${rupiah(b.harga_sewa)} <span class="satuan">/${satuanLabel(b.satuan_harga)}</span></div>
          </div>
        </div>`;
      }).join('');
    }

    muatToko().catch(() => {
      document.getElementById('pesan').textContent = 'Gagal memuat toko. Coba lagi nanti.';
    });
  </script>
</body>
</html>
