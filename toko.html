<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko - RENTALL</title>
  <meta name="description" content="Lihat toko sewa di RENTALL.">
  <style>
    body { font-family: sans-serif; margin: 0; background: #f4f5f7; color: #1f2937; }
    .bahasa { position: fixed; top: 10px; right: 10px; z-index: 5; background: rgba(255,255,255,0.9); border-radius: 10px; padding: 3px; font-size: 12px; }
    .bahasa button { border: 0; background: none; padding: 5px 9px; border-radius: 8px; cursor: pointer; color: #046a4f; font-weight: 700; }
    .bahasa button.aktif { background: #046a4f; color: #fff; }
    .banner { height: 160px; background: #046a4f center/cover no-repeat; }
    .profil { text-align: center; margin-top: -48px; }
    .foto { width: 96px; height: 96px; border-radius: 50%; border: 4px solid #fff; background: #e0f5ef; object-fit: cover; }
    .nama { font-size: 20px; font-weight: 700; margin: 10px 0 4px; }
    .info { color: #6b7684; font-size: 14px; }
    .badge { display: inline-block; background: #e0f5ef; color: #046a4f; padding: 4px 10px; border-radius: 12px; font-size: 12px; margin-top: 6px; }
    .pesan { text-align: center; padding: 40px; color: #6b7684; }
    .daftar { max-width: 720px; margin: 24px auto; padding: 0 16px; }
    .daftar h2 { font-size: 16px; margin: 0 0 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
    .kartu { background: #fff; border: 1px solid #e5e8e6; border-radius: 14px; overflow: hidden; color: inherit; }
    .kartu .gambar { height: 130px; background: #046a4f; display: flex; align-items: center; justify-content: center; }
    .kartu .gambar img { width: 100%; height: 100%; object-fit: cover; }
    .kartu .isi { padding: 10px; }
    .kartu .judul { font-size: 14px; font-weight: 600; }
    .kartu .harga { color: #046a4f; font-weight: 700; font-size: 14px; margin-top: 4px; }
    .kartu .satuan { color: #6b7684; font-weight: 400; font-size: 11px; }
    .tag { font-size: 10px; color: #046a4f; background: #e0f5ef; border-radius: 8px; padding: 2px 6px; display: inline-block; margin-bottom: 4px; }
    .sewa-btn { display: block; text-align: center; margin-top: 8px; background: #046a4f; color: #fff; text-decoration: none; font-size: 12px; font-weight: 700; padding: 7px; border-radius: 10px; }
    .kosong { color: #6b7684; font-size: 14px; text-align: center; padding: 20px; }
    .ajakan { max-width: 720px; margin: 24px auto; padding: 16px; background: #046a4f; color: #fff; border-radius: 16px; text-align: center; }
    .ajakan p { margin: 0 0 10px; font-weight: 700; font-size: 15px; }
    .ajakan a { display: inline-block; background: #fff; color: #046a4f; text-decoration: none; font-weight: 700; font-size: 13px; padding: 9px 16px; border-radius: 12px; }
  </style>
</head>
<body>
  <div class="bahasa">
    <button id="btnId" onclick="setBahasa('id')">ID</button><button id="btnEn" onclick="setBahasa('en')">EN</button>
  </div>

  <div class="banner" id="banner"></div>
  <div class="profil">
    <img class="foto" id="foto" alt="">
    <div class="nama" id="nama">...</div>
    <div class="info" id="rating"></div>
    <div id="badge"></div>
  </div>

  <div class="ajakan" id="ajakanAtas" hidden>
    <p data-i18n="ajakan">Cari atau butuh barang sewaan?</p>
    <a class="link-app" href="LINK_DOWNLOAD_APLIKASI" target="_blank" rel="noopener" data-i18n="unduh">Unduh RENTALL</a>
  </div>

  <div class="pesan" id="pesan"></div>

  <div class="daftar" id="daftar" hidden>
    <h2 data-i18n="judulBarang">Barang dan paket</h2>
    <div class="grid" id="grid"></div>
    <div class="kosong" id="kosong" hidden data-i18n="kosong">Belum ada barang yang aktif.</div>
  </div>

  <div class="ajakan" id="ajakanBawah" hidden>
    <p data-i18n="ajakanBawah">Cari atau butuh barang sewaan? Unduh RENTALL, sewa lebih hemat.</p>
    <a class="link-app" href="LINK_DOWNLOAD_APLIKASI" target="_blank" rel="noopener" data-i18n="unduh">Unduh RENTALL</a>
  </div>

  <script>
    const SUPABASE_URL = 'https://xdzmysjfpwcpjdrwkksk.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhkem15c2pmcHdjcGpkcndra3NrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzODE4MjgsImV4cCI6MjEwMzk1NzgyOH0.FR2EeoAnrYFjD4p12s-6CoDGg6FG6svgyyOqRfbsRBk';
    const LINK_APLIKASI = 'LINK_DOWNLOAD_APLIKASI';

    const TEKS = {
      id: {
        ajakan: 'Cari atau butuh barang sewaan?',
        ajakanBawah: 'Cari atau butuh barang sewaan? Unduh RENTALL, sewa lebih hemat.',
        unduh: 'Unduh RENTALL',
        judulBarang: 'Barang dan paket',
        kosong: 'Belum ada barang yang aktif.',
        sewa: 'Sewa di aplikasi',
        paket: 'Paket',
        terverifikasi: 'Terverifikasi',
        tidakDitemukan: 'Toko tidak ditemukan',
        alamatSalah: 'Alamat toko ini tidak tersedia.',
        gagal: 'Gagal memuat toko. Coba lagi nanti.',
        satuan: { jam: 'jam', hari: 'hari', bulan: 'bulan' },
        locale: 'id-ID'
      },
      en: {
        ajakan: 'Looking for or need rental items?',
        ajakanBawah: 'Looking for or need rental items? Download RENTALL, rent smarter.',
        unduh: 'Download RENTALL',
        judulBarang: 'Items and packages',
        kosong: 'No active items yet.',
        sewa: 'Rent in the app',
        paket: 'Package',
        terverifikasi: 'Verified',
        tidakDitemukan: 'Shop not found',
        alamatSalah: 'This shop address is not available.',
        gagal: 'Failed to load the shop. Please try again later.',
        satuan: { jam: 'hour', hari: 'day', bulan: 'month' },
        locale: 'en-US'
      }
    };

    let bahasa = (navigator.language || 'id').toLowerCase().startsWith('id') ? 'id' : 'en';
    let tokoAktif = null;
    let barangAktif = null;

    const slug = decodeURIComponent(location.pathname.replace(/^\/t\//, '').replace(/\/$/, ''));
    const headers = { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` };

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function rupiah(n) {
      return 'Rp' + Number(n).toLocaleString(TEKS[bahasa].locale);
    }

    function satuanLabel(s) {
      return TEKS[bahasa].satuan[s] || TEKS[bahasa].satuan.hari;
    }

    function terapkanBahasa() {
      const t = TEKS[bahasa];
      document.documentElement.lang = bahasa;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t[el.dataset.i18n];
      });
      document.querySelectorAll('.link-app').forEach(el => { el.href = LINK_APLIKASI; });
      document.getElementById('btnId').classList.toggle('aktif', bahasa === 'id');
      document.getElementById('btnEn').classList.toggle('aktif', bahasa === 'en');
      if (tokoAktif) {
        document.title = `${tokoAktif.nama} - RENTALL`;
        document.getElementById('badge').innerHTML = tokoAktif.badge_terverifikasi
          ? `<span class="badge">${t.terverifikasi}</span>` : '';
      }
      if (barangAktif) tampilkanBarang(barangAktif);
    }

    function setBahasa(b) {
      bahasa = b;
      terapkanBahasa();
    }

    function tampilkanBarang(data) {
      const t = TEKS[bahasa];
      const grid = document.getElementById('grid');
      document.getElementById('daftar').hidden = false;
      document.getElementById('kosong').hidden = data.length > 0;
      grid.innerHTML = data.map(b => {
        const foto = (b.foto && b.foto[0])
          ? `<img src="${escapeHtml(b.foto[0])}" alt="${escapeHtml(b.judul)}">` : '';
        const tag = b.jenis === 'paket' ? `<span class="tag">${t.paket}</span><br>` : '';
        return `<div class="kartu">
          <div class="gambar">${foto}</div>
          <div class="isi">
            ${tag}
            <div class="judul">${escapeHtml(b.judul)}</div>
            <div class="harga">${rupiah(b.harga_sewa)} <span class="satuan">/${satuanLabel(b.satuan_harga)}</span></div>
            <a class="sewa-btn link-app" href="${escapeHtml(LINK_APLIKASI)}" target="_blank" rel="noopener">${t.sewa}</a>
          </div>
        </div>`;
      }).join('');
    }

    async function muatToko() {
      const url = `${SUPABASE_URL}/rest/v1/toko_publik?slug=eq.${encodeURIComponent(slug)}&select=*`;
      const res = await fetch(url, { headers });
      const data = await res.json();
      if (!res.ok || !data.length) {
        document.getElementById('nama').textContent = TEKS[bahasa].tidakDitemukan;
        document.getElementById('pesan').textContent = TEKS[bahasa].alamatSalah;
        return;
      }
      tokoAktif = data[0];
      document.getElementById('nama').textContent = tokoAktif.nama;
      document.getElementById('rating').textContent = `★ ${Number(tokoAktif.rating_avg || 0).toFixed(1)}`;
      if (tokoAktif.foto_url) document.getElementById('foto').src = tokoAktif.foto_url;
      if (tokoAktif.banner_url) document.getElementById('banner').style.backgroundImage = `url(${tokoAktif.banner_url})`;
      document.getElementById('ajakanAtas').hidden = false;
      terapkanBahasa();
      await muatBarang();
    }

    async function muatBarang() {
      const url = `${SUPABASE_URL}/rest/v1/barang_publik?toko_slug=eq.${encodeURIComponent(slug)}&select=*&order=created_at.desc`;
      const res = await fetch(url, { headers });
      const data = await res.json();
      barangAktif = res.ok ? data : [];
      tampilkanBarang(barangAktif);
      document.getElementById('ajakanBawah').hidden = false;
    }

    terapkanBahasa();
    muatToko().catch(() => {
      document.getElementById('pesan').textContent = TEKS[bahasa].gagal;
    });
  </script>
</body>
</html>
